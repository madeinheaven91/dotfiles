# [env]
# TERM = "xterm-256color"

[window]
decorations = "none"
dynamic_padding = true

[window.padding]
x = 0
y = 0

[font]
size = 14

[font.bold]
family = "CodeNewRoman Nerd Font"
style = "Heavy"

[font.bold_italic]
family = "CodeNewRoman Nerd Font"
style = "Heavy Italic"

[font.italic]
family = "CodeNewRoman Nerd Font"
style = "Regular Italic"

[font.normal]
family = "CodeNewRoman Nerd Font"
style = "Regular"

[general]
live_config_reload = true
import = ["~/.config/alacritty/themes/alabaster_dark.toml"]
